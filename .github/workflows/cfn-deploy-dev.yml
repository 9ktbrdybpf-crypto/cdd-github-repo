name: CDD CloudFormation Deploy (dev)
on:
    push:
      branches:
        - main
      paths:
        - "src/**"
        - "parameters/dev/**"
        - "scripts/deploy.sh"
        - ".github/workflows/cfn-deploy*.yml"
    workflow_dispatch: {}

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    uses: ./.github/workflows/cfn-deploy-reusable.yml
    permissions:
      id-token: write
      contents: read
    with:
      deploy_env: d00
      param_env: dev
      aws_account_id: "850995570478"
      aws_role_arn: "arn:aws:iam::850995570478:role/cdd-d00-iam-role-github-action-infra"
      approval_environment: cdd-deploy-approval-dev