name: CloudFormation Template Check
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  cfn-lint:
    name: CloudFormation Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install cfn-lint and checkov
        run: python3 -m pip install --upgrade 'cfn-lint >=1,<2' 'checkov >=3,<4'

      - name: cfn-lint
        run: |
            mapfile -t templates < <(find src -type f \( -name '*.yaml' -o -name '*.yml' \))
            if [ ${#templates[@]} -eq 0 ]; then
                echo "No CloudFormation templates under src/."
            else
                cfn-lint "${templates[@]}"
            fi

      - name: checkov (advisory)
        run: checkov -d src --framework cloudformation --quiet --compact --soft-fail

  shellcheck:
    name: Shell script lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: ShellCheck
        run: sudo apt-get install shellcheck

      - name: Run ShellCheck
        run: |
            mapfile -t scripts < <(find . -type f -name '*.sh' 2>/dev/null || true)
            if [ ${#scripts[@]} -eq 0 ]; then
                echo "No shell scripts under scripts/."
            else
                shellcheck --severity=warning "${scripts[@]}"
            fi

  actionlint:
    name: workflow lint
    runs-on: ubuntu-latest
    env:
      ACTIONLINT_VERSION: "1.7.7"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install actionlint
        run: | 
            curl -sSL https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_Linux_amd64.tar.gz | tar -xz actionlint
            sudo mv actionlint /usr/local/bin/
            actionlint --version

      - name: actionlint
        run: actionlint -shellcheck=""